name: 🛡 Audit-Check

on:
  schedule:
    - cron: '0 0 * * *'
  push:
      paths:
        - '**/Cargo.toml'
        - '**/Cargo.lock'

jobs:
  security-audit:
    permissions:
      checks: write
      issues: write
      security-events: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Run Audit-Check
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
